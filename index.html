<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyes &amp; Beans</title>
<meta name="description" content="Koffie turven op de afdeling.">
<meta name="apple-mobile-web-app-title" content="Eyes &amp; Beans">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Lettertypen van de huisstijl; laden zonder het logo op te houden -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&amp;family=Poppins:wght@700&amp;display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #F6F1EB; --tekst: #2B2118; --zacht: #6E5E50; --amp: #8C5C33; --goud: #B5793F; --gloed: rgba(181, 121, 63, .16);
    --lijn: #3B2A20; --glas: #FFFDF9; --boon: #6F4E37; --nerf: #F3E3CF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15110E; --tekst: #F3ECE4; --zacht: #B9A99A; --amp: #D9A877; --goud: #D9A877; --gloed: rgba(217, 168, 119, .16);
      --lijn: #F3ECE4; --glas: #251E19; --boon: #D9A877; --nerf: #251E19;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tekst);
               font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

  /* Bonenregen bovenaan: vult het bovenste deel van het scherm en vloeit naar onderen weg.
     De bonen vallen in perspectief, alsof je er van bovenaf op kijkt: ze vallen van je af naar een punt
     onder het midden, worden daarbij kleiner en draaien een klein beetje mee. De voorste (grote) bonen
     komen van dichterbij en bewegen dus veel meer dan de achterste (parallax). */
  .bonen { position: fixed; top: 0; left: 0; right: 0; height: 58vh; min-height: 380px; overflow: hidden; pointer-events: none;
           -webkit-mask-image: linear-gradient(#000 42%, transparent 82%); mask-image: linear-gradient(#000 42%, transparent 82%);
           animation: bonenIn 1s ease-out both; }
  .bonen svg { display: block; width: 100%; height: 100%; }
  @keyframes bonenIn { from { opacity: 0; } }
  .laag { transform-origin: 195px 470px; animation: 4.6s cubic-bezier(.12, .62, .22, 1) both; }
  .achter { animation-name: valAchter; } .midden { animation-name: valMidden; } .voor { animation-name: valVoor; }
  @keyframes valAchter { from { transform: scale(1.06) rotate(-1deg); } }
  @keyframes valMidden { from { transform: scale(1.15) rotate(-2deg); } }
  @keyframes valVoor { from { transform: scale(1.32) rotate(-3.5deg); } }
  .gloed { position: fixed; left: -20%; right: -20%; top: 34vh; height: 42vh; pointer-events: none;
           background: radial-gradient(closest-side, var(--gloed), transparent); }

  /* Laadscherm: direct het logo, dan schuift "Eerst koffie," van links in,
     daarna "dan zien we wel." van rechts, en tot slot knipoogt de rechter boon. */
  .laden { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: flex-start; padding: 45vh 24px 24px; box-sizing: border-box; text-align: center; overflow: hidden; }
  .laden svg { width: 240px; height: 78px; }
  .naam { margin: 18px 0 0; font: 700 29px/1.2 Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          letter-spacing: 3px; text-transform: uppercase; }
  .naam .amp { color: var(--amp); }
  .streep { width: 36px; height: 1.5px; margin: 20px auto 0; background: var(--goud); opacity: .6; }
  .lijn { fill: none; stroke: var(--lijn); stroke-width: 10; stroke-linecap: round; }
  .glas { fill: var(--glas); stroke: var(--lijn); stroke-width: 10; }
  .boon { fill: var(--boon); }
  .nerf { fill: none; stroke: var(--nerf); stroke-width: 5; stroke-linecap: round; }

  .slogan { margin: 18px 0 0; min-height: 2.5em; font-family: Fraunces, Georgia, "Times New Roman", serif;
            font-style: italic; font-weight: 500; font-size: 32px; line-height: 1.25; }
  .slogan span { display: block; opacity: 0; filter: blur(3px);
                 animation: inschuiven .9s cubic-bezier(.2, .7, .2, 1) forwards; }
  .slogan .stap1 { transform: translateX(-56px); animation-delay: 1s; }   /* "Eerst koffie," van links, na 1 seconde */
  .slogan .stap2 { transform: translateX(56px); animation-delay: 2s; }    /* "dan zien we wel." van rechts, na 2 seconden */
  @keyframes inschuiven { to { opacity: 1; transform: none; filter: none; } }
  @keyframes verschijnen { to { opacity: 1; } }

  /* Knipoog van de rechter boon, na de slogan (3,2 s). De bril kantelt daarbij heel even. */
  .laden svg { animation: kantel .8s ease-in-out 3.2s both; }
  .knipoog { transform-box: fill-box; transform-origin: center; animation: dicht .8s ease-in-out 3.2s both; }
  .ooglid { fill: none; stroke: var(--boon); stroke-width: 7; stroke-linecap: round; opacity: 0;
            animation: lid .8s ease-in-out 3.2s both; }
  @keyframes dicht { 0%, 100% { transform: scaleY(1); } 30%, 70% { transform: scaleY(0); } }
  @keyframes lid { 0%, 22%, 78%, 100% { opacity: 0; } 32%, 68% { opacity: 1; } }
  @keyframes kantel { 0%, 100% { transform: none; } 35%, 65% { transform: rotate(-4deg); } }

  @media (prefers-reduced-motion: reduce) {
    .slogan .stap1, .slogan .stap2 { transform: none; filter: none; animation-name: verschijnen; animation-duration: .4s; }
    .laden svg, .knipoog, .ooglid { animation: none; }
    .bonen { animation: bonenIn .4s ease-out both; }
    .laag { animation: none; }
  }
  @media (max-height: 600px) { .bonen { height: 48vh; min-height: 0; } .laden { padding-top: 38vh; } .laden svg { width: 196px; height: 64px; } .naam { font-size: 24px; } .slogan { font-size: 26px; } }

  /* Noodlink onderaan, klein; komt pas als het laden lang duurt */
  .nood { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom));
          margin: 0; text-align: center; font-size: 13px; color: var(--zacht);
          opacity: 0; transition: opacity .5s ease; }
  .nood.zichtbaar { opacity: 1; }
  .nood a { color: var(--zacht); }

  /* De app zelf, schermvullend binnen de veilige zone van de iPhone.
     Onzichtbaar (en niet aan te tikken) tot hij geladen is en de slogan er staat. */
  iframe { position: fixed; border: 0; background: transparent;
           top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
           left: env(safe-area-inset-left); right: env(safe-area-inset-right);
           width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
           height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
           opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  iframe.zichtbaar { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="gloed" aria-hidden="true"></div>
<div class="bonen" id="bonen" aria-hidden="true"></div>
<script>
  // Getekende koffiebonen (altijd dezelfde plek), met diepte: grote bonen vooraan en kleine achteraan iets onscherp.
  (function () {
    var w = 390, h = 560, seed = 21, items = [];
    function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    for (var i = 0; i < 46; i++) {
      var s = (0.55 + Math.pow(rnd(), 1.3) * 1.15) * 1.05;
      items.push({ x: -25 + rnd() * (w + 50), y: -20 + 380 * Math.pow(rnd(), 1.45), s: s, rot: rnd() * 360, nerf: rnd() > 0.3, t: rnd() });
    }
    items.sort(function (a, b) { return a.s - b.s; });
    var defs = '<defs>' +
      '<radialGradient id="b1" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#A9724D"/><stop offset=".45" stop-color="#704429"/><stop offset="1" stop-color="#341D12"/></radialGradient>' +
      '<radialGradient id="b2" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#93603F"/><stop offset=".5" stop-color="#5E3822"/><stop offset="1" stop-color="#2B170E"/></radialGradient>' +
      '<filter id="sch" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>' +
      '<filter id="f1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.1"/></filter>' +
      '<filter id="f3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>' +
      '<filter id="f5" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.6"/></filter></defs>';
    var lagen = { achter: '', midden: '', voor: '' };
    items.forEach(function (b) {
      var f = b.s > 1.45 ? 'f5' : b.s > 1.3 ? 'f3' : b.s < 0.7 ? 'f1' : '';
      lagen[b.s > 1.3 ? 'voor' : b.s > 0.9 ? 'midden' : 'achter'] += '<g transform="translate(' + (b.x + 5 * b.s) + ' ' + (b.y + 9 * b.s) + ') rotate(' + b.rot + ') scale(' + b.s + ')">' +
        '<ellipse rx="31" ry="20" fill="#1A0F09" opacity=".38" filter="url(#sch)"/></g>' +
        '<g transform="translate(' + b.x + ' ' + b.y + ') rotate(' + b.rot + ') scale(' + b.s + ')"' + (f ? ' filter="url(#' + f + ')"' : '') + '>' +
        '<path d="M-31 0C-31-13-17-21.5 0-21.5S31-12.5 31 0 17 21.5 0 21.5-31 13-31 0Z" fill="url(#' + (b.t > .5 ? 'b1' : 'b2') + ')"/>' +
        (b.nerf
          ? '<path d="M-27 3.5C-17-6.5-7 8.5 3 -.5S20-7.5 28-3.5" fill="none" stroke="#1A0D06" stroke-width="3.6" stroke-linecap="round"/>' +
            '<path d="M-26 7C-16-3-6 12 4 3S20-4 27 0" fill="none" stroke="#D49A6A" stroke-opacity=".28" stroke-width="1.4" stroke-linecap="round"/>'
          : '<path d="M-22 -1C-10 -7 10 -7 22 -1" fill="none" stroke="#E2AE80" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"/>') +
        '<ellipse cx="-9" cy="-11" rx="13" ry="4.2" fill="#FFF3E6" opacity=".15" transform="rotate(-10)"/></g>';
    });
    document.getElementById('bonen').innerHTML =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMin slice">' + defs +
      '<g class="laag achter">' + lagen.achter + '</g><g class="laag midden">' + lagen.midden + '</g><g class="laag voor">' + lagen.voor + '</g></svg>';
  })();
</script>
<div class="laden">
  <svg viewBox="-130 -42 260 84" role="img" aria-label="Logo Eyes &amp; Beans">
    <path class="lijn" d="M-104 -10 L-122 -24 M104 -10 L122 -24 M-16 -8 Q0 -22 16 -8"></path>
    <ellipse class="glas" cx="-58" cy="0" rx="44" ry="33"></ellipse>
    <ellipse class="glas" cx="58" cy="0" rx="44" ry="33"></ellipse>
    <g transform="translate(-58 0) rotate(-12)"><ellipse class="boon" rx="28" ry="19"></ellipse><path class="nerf" d="M-24 3 C-9 -9 9 11 24 -3"></path></g>
    <g transform="translate(58 0) rotate(12)">
      <g class="knipoog"><ellipse class="boon" rx="28" ry="19"></ellipse><path class="nerf" d="M-24 -3 C-9 11 9 -9 24 3"></path></g>
      <path class="ooglid" d="M-24 -2 Q0 12 24 -2"></path>
    </g>
  </svg>
  <p class="naam">Eyes <span class="amp">&amp;</span> Beans</p>
  <div class="streep" aria-hidden="true"></div>
  <p class="slogan"><span class="stap1">Eerst koffie,</span><span class="stap2">dan zien we wel.</span></p>
</div>
<p class="nood" id="nood">Laadt het niet? <a id="direct" href="#">Open direct</a></p>

<iframe id="app" title="Eyes &amp; Beans"></iframe>

<script>
  // Het adres van de web-app (Apps Script, eindigt op /exec).
  var APP = 'https://script.google.com/macros/s/AKfycbxHiCPRrQeP8_PsJu9SLqdmtlXPU2bLezYV--xXiUtr9FBOzgQyqV65iiBWamSLOvqS/exec';

  // Hoe lang het laadscherm minstens blijft staan: logo, na 1 s "Eerst koffie," (van links),
  // na 2 s "dan zien we wel." (van rechts), van 3,2 tot 4 s de knipoog, dan de app.
  // Wie op de telefoon "minder beweging" aan heeft, krijgt geen knipoog en is sneller binnen.
  var MIN_MS = 4200;
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) MIN_MS = 3000; } catch (e) {}
  var NOODLINK_NA_MS = 6000;   // pas dan de kleine link onderaan tonen
  var VANGNET_MS = 15000;      // app sowieso tonen, ook zonder load-signaal

  // Onthouden: je naam, je inlog voor Mijn overzicht en "Zelfde als vorige keer".
  // De app draait hieronder als ingesloten venster van Google; wat dat venster bewaart,
  // gooit Safari weg zodra je de app sluit. Daarom bewaart deze pagina het zelf.
  // De app vraagt het op ("hallo") en meldt elke wijziging ("bewaar").
  var OPSLAG = 'ebOnthouden';
  var GOOGLE = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;   // alleen het app-venster van Apps Script
  function leesOpslag() {
    try { var o = JSON.parse(localStorage.getItem(OPSLAG) || 'null'); return o && typeof o === 'object' ? o : {}; }
    catch (e) { return {}; }
  }
  function schrijfOpslag(o) { try { localStorage.setItem(OPSLAG, JSON.stringify(o)); } catch (e) {} }
  function schoneKeuze(v) {
    if (!v || typeof v !== 'object') return null;
    var uit = {}, n = 0;
    Object.keys(v).slice(0, 30).forEach(function (d) {
      var a = Math.floor(Number(v[d]));
      if (d.length <= 60 && a >= 1 && a <= 10) { uit[d] = a; n++; }
    });
    return n ? uit : null;
  }
  var opslag = leesOpslag();
  window.addEventListener('message', function (e) {
    if (!GOOGLE.test(e.origin) || !e.source) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.eb === 'hallo') {
      e.source.postMessage({ eb: 'opslag', ik: opslag.ik || '', mijn: opslag.mijn || null, vorige: opslag.vorige || null }, e.origin);
    } else if (d.eb === 'bewaar') {
      var m = d.mijn;
      opslag = {
        ik: typeof d.ik === 'string' ? d.ik.slice(0, 60) : '',
        mijn: m && typeof m.naam === 'string' && /^[0-9a-f]{32}$/.test(String(m.token || ''))
          ? { naam: m.naam.slice(0, 60), token: m.token } : null,
        vorige: schoneKeuze(d.vorige),
      };
      schrijfOpslag(opslag);
    }
  });
  // Het adres van de app, met je naam erbij als die bekend is (dan staat hij er meteen).
  function adres() {
    var q = location.search.replace(/^\?/, '');
    if (opslag.ik && !/(^|&)ik=/.test(q)) q += (q ? '&' : '') + 'ik=' + encodeURIComponent(opslag.ik);
    return APP + (q ? '?' + q : '');
  }

  var app = document.getElementById('app');
  var start = Date.now();
  var getoond = false;
  function toonApp() { getoond = true; app.classList.add('zichtbaar'); }
  app.addEventListener('load', function () {
    setTimeout(toonApp, Math.max(0, MIN_MS - (Date.now() - start)));
  });
  setTimeout(function () { if (!getoond) document.getElementById('nood').classList.add('zichtbaar'); }, NOODLINK_NA_MS);
  setTimeout(toonApp, VANGNET_MS);
  app.src = adres();
  document.getElementById('direct').href = adres();
</script>
</body>
</html>
