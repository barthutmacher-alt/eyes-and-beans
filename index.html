<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyes &amp; Beans</title>
<meta name="description" content="Koffie turven op de afdeling.">
<meta name="apple-mobile-web-app-title" content="Eyes &amp; Beans">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1714" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Lettertypen van de huisstijl; laden zonder het logo op te houden -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&amp;family=Poppins:wght@700&amp;display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #F6F1EB; --tekst: #2B2118; --zacht: #6E5E50; --amp: #8C5C33;
    --lijn: #3B2A20; --glas: #FFFDF9; --boon: #6F4E37; --nerf: #F3E3CF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1714; --tekst: #F3ECE4; --zacht: #B9A99A; --amp: #D9A877;
      --lijn: #F3ECE4; --glas: #2A221D; --boon: #D9A877; --nerf: #2A221D;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tekst);
               font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

  /* Laadscherm: direct het logo, daarna vloeit de slogan in twee stappen in */
  .laden { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; padding: 24px; text-align: center; }
  .laden svg { width: 168px; height: 54px; }
  .naam { margin: 14px 0 0; font: 700 20px/1.2 Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          letter-spacing: 3px; text-transform: uppercase; }
  .naam .amp { color: var(--amp); }
  .lijn { fill: none; stroke: var(--lijn); stroke-width: 10; stroke-linecap: round; }
  .glas { fill: var(--glas); stroke: var(--lijn); stroke-width: 10; }
  .boon { fill: var(--boon); }
  .nerf { fill: none; stroke: var(--nerf); stroke-width: 5; stroke-linecap: round; }

  .slogan { margin: 28px 0 0; min-height: 2.5em; font-family: Fraunces, Georgia, "Times New Roman", serif;
            font-style: italic; font-weight: 500; font-size: 27px; line-height: 1.25; }
  .slogan span { display: block; opacity: 0; transform: translateY(12px); filter: blur(4px);
                 animation: invloeien .9s cubic-bezier(.2, .7, .2, 1) forwards; }
  .slogan .stap1 { animation-delay: 1s; }   /* "Eerst koffie," na 1 seconde */
  .slogan .stap2 { animation-delay: 2s; }   /* "dan zien we wel." na 2 seconden */
  @keyframes invloeien { to { opacity: 1; transform: none; filter: none; } }
  @keyframes verschijnen { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .slogan span { transform: none; filter: none; animation-name: verschijnen; animation-duration: .4s; }
  }

  /* Noodlink onderaan, klein; komt pas als het laden lang duurt */
  .nood { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom));
          margin: 0; text-align: center; font-size: 13px; color: var(--zacht);
          opacity: 0; transition: opacity .5s ease; }
  .nood.zichtbaar { opacity: 1; }
  .nood a { color: var(--zacht); }

  /* De app zelf, schermvullend binnen de veilige zone van de iPhone.
     Onzichtbaar (en niet aan te tikken) tot hij geladen is en de slogan er staat. */
  iframe { position: fixed; border: 0; background: transparent;
           top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
           left: env(safe-area-inset-left); right: env(safe-area-inset-right);
           width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
           height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
           opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  iframe.zichtbaar { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="laden">
  <svg viewBox="-130 -42 260 84" role="img" aria-label="Logo Eyes &amp; Beans">
    <path class="lijn" d="M-104 -10 L-122 -24 M104 -10 L122 -24 M-16 -8 Q0 -22 16 -8"></path>
    <ellipse class="glas" cx="-58" cy="0" rx="44" ry="33"></ellipse>
    <ellipse class="glas" cx="58" cy="0" rx="44" ry="33"></ellipse>
    <g transform="translate(-58 0) rotate(-12)"><ellipse class="boon" rx="28" ry="19"></ellipse><path class="nerf" d="M-24 3 C-9 -9 9 11 24 -3"></path></g>
    <g transform="translate(58 0) rotate(12)"><ellipse class="boon" rx="28" ry="19"></ellipse><path class="nerf" d="M-24 -3 C-9 11 9 -9 24 3"></path></g>
  </svg>
  <p class="naam">Eyes <span class="amp">&amp;</span> Beans</p>
  <p class="slogan"><span class="stap1">Eerst koffie,</span><span class="stap2">dan zien we wel.</span></p>
</div>
<p class="nood" id="nood">Laadt het niet? <a id="direct" href="#">Open direct</a></p>

<iframe id="app" title="Eyes &amp; Beans"></iframe>

<script>
  // Het adres van de web-app (Apps Script, eindigt op /exec).
  var APP = 'https://script.google.com/macros/s/AKfycbxHiCPRrQeP8_PsJu9SLqdmtlXPU2bLezYV--xXiUtr9FBOzgQyqV65iiBWamSLOvqS/exec';

  // Hoe lang het laadscherm minstens blijft staan: logo, na 1 s "Eerst koffie,",
  // na 2 s "dan zien we wel." en die nog even laten lezen.
  var MIN_MS = 3200;
  var NOODLINK_NA_MS = 6000;   // pas dan de kleine link onderaan tonen
  var VANGNET_MS = 15000;      // app sowieso tonen, ook zonder load-signaal

  var app = document.getElementById('app');
  var start = Date.now();
  var getoond = false;
  function toonApp() { getoond = true; app.classList.add('zichtbaar'); }
  app.addEventListener('load', function () {
    setTimeout(toonApp, Math.max(0, MIN_MS - (Date.now() - start)));
  });
  setTimeout(function () { if (!getoond) document.getElementById('nood').classList.add('zichtbaar'); }, NOODLINK_NA_MS);
  setTimeout(toonApp, VANGNET_MS);
  app.src = APP + location.search;
  document.getElementById('direct').href = APP + location.search;
</script>
</body>
</html>
